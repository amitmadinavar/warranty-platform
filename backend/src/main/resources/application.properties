# MySQL configuration
# Change DB_USERNAME / DB_PASSWORD in your environment when required.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/warranty_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mysql@123}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# API / application settings
spring.jackson.serialization.write-dates-as-timestamps=false
sla.hours=${SLA_HOURS:48}
server.port=${SERVER_PORT:8080}

# Authentication / real-time settings
jwt.secret=${JWT_SECRET:WarrantyOS-Dev-Secret-Key-Change-In-Production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
